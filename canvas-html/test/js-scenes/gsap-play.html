<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;font-weight:400;src:url(../assets/Inter-Regular.otf)}
@font-face{font-family:Inter;font-weight:700;src:url(../assets/Inter-Bold.otf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden}
body{font-family:Inter;background:#0b1020;color:#fff}
#title{position:absolute;left:80px;top:70px;font-size:72px;font-weight:700;letter-spacing:-2px}
#sub{position:absolute;left:82px;top:165px;font-size:28px;color:#94a3b8}
.cards{position:absolute;left:80px;top:250px;display:flex;gap:24px}
.card{width:200px;height:150px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700}
#ball{position:absolute;left:80px;top:540px;width:60px;height:60px;border-radius:30px;background:#f472b6}
#count{position:absolute;right:80px;top:450px;font-size:96px;font-weight:700;color:#22d3ee}
#track{position:absolute;left:80px;top:620px;width:1120px;height:12px;border-radius:6px;background:rgba(255,255,255,.12)}
#fill{position:absolute;left:0;top:0;height:12px;width:0;border-radius:6px;background:#6366f1}
</style></head><body>
<div id="title">GSAP, no browser</div><div id="sub">Boa JS + Blitz layout + Skia pixels</div>
<div class="cards"><div class="card" style="background:#6366f1">1</div><div class="card" style="background:#0ea5e9">2</div><div class="card" style="background:#10b981">3</div><div class="card" style="background:#f59e0b">4</div><div class="card" style="background:#ef4444">5</div></div>
<div id="ball"></div><div id="count">0</div><div id="track"><div id="fill"></div></div>
<script src="../assets/gsap.min.js"></script>
<script>
const tl = gsap.timeline();
tl.from("#title", { y: 40, opacity: 0, duration: 0.8, ease: "power3.out" })
  .from("#sub", { y: 20, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.3)
  .from(".card", { scale: 0.5, rotation: -15, opacity: 0, duration: 0.7, stagger: 0.12, ease: "back.out(1.7)" }, 0.6)
  .to("#ball", { x: 900, duration: 1.6, ease: "elastic.out(1, 0.4)" }, 1.0)
  .to("#fill", { width: 1120, backgroundColor: "#22d3ee", duration: 2.0, ease: "power1.inOut" }, 1.0)
  .to({ n: 0 }, { n: 100, duration: 2.0, ease: "none", onUpdate() { document.getElementById("count").textContent = Math.round(this.targets()[0].n) + "%" } }, 1.0);

</script></body></html>
