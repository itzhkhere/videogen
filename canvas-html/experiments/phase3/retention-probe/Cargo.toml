[package]
name = "phase3-retention-probe"
version = "0.1.0"
edition = "2024"
publish = false
description = "Isolates the native allocation retained per new Blitz document (no JS engine, no napi)"

[dependencies]
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "0db8c74a5f8a0df77eed1b33c846eb041515b6c7" }
blitz-html = { git = "https://github.com/DioxusLabs/blitz", rev = "0db8c74a5f8a0df77eed1b33c846eb041515b6c7" }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz", rev = "0db8c74a5f8a0df77eed1b33c846eb041515b6c7" }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "0db8c74a5f8a0df77eed1b33c846eb041515b6c7" }
parley = { git = "https://github.com/linebender/parley", rev = "718dcb721941fd8e72128833122d31f5a4e80504", default-features = false, features = ["std", "system"] }
anyrender = "0.14"
anyrender_skia = "0.12"
peniko = "0.6"
libc = "0.2"
# Same version as anyrender_skia; no extra features (unified with its feature set)
skia-safe = { version = "=0.153.3", default-features = false }
serde_json.workspace = true
