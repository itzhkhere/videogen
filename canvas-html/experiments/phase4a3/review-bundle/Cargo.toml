[package]
name = "html-renderer"
version = "0.6.0-rc.1"
edition = "2024"
description = "Render HTML + CSS (with CSS animations) to pixels with Blitz + Skia, no browser"
publish = false

[lib]
crate-type = ["cdylib"]

# The shared DOM host is a member so that it builds and tests against the same lockfile and
# [patch] set. The experiments directory is its own workspace.
[workspace]
members = ["dom-host"]
exclude = ["experiments", "third_party"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8", "serde-json"] }
serde_json = "1"
napi-derive = "3"
# Blitz: Stylo (CSS) + Taffy (layout) + Parley (text). Pinned to the commit this was tested on.
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "0db8c74a5f8a0df77eed1b33c846eb041515b6c7", features = ["default"] }
blitz-html = { git = "https://github.com/DioxusLabs/blitz", rev = "0db8c74a5f8a0df77eed1b33c846eb041515b6c7" }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz", rev = "0db8c74a5f8a0df77eed1b33c846eb041515b6c7" }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "0db8c74a5f8a0df77eed1b33c846eb041515b6c7" }
blitz-vibey-script = { git = "https://github.com/DioxusLabs/blitz", rev = "0db8c74a5f8a0df77eed1b33c846eb041515b6c7" }
# must be the exact parley revision Blitz uses so FontContext is the same type
parley = { git = "https://github.com/linebender/parley", rev = "718dcb721941fd8e72128833122d31f5a4e80504", default-features = false, features = ["std", "system"] }
anyrender = "0.14"
anyrender_skia = { version = "0.12", default-features = false }
peniko = "0.6"
url = "2.5"
bytes = "1.7"
base64 = "0.22"
percent-encoding = "2.3"
png = "0.18"
# Phase 4A.1: madvise(MADV_HUGEPAGE) for fresh output frames (already in the dependency tree)
libc = "0.2"
# Engine-neutral DOM host shared with the experimental Deno/V8 adapter (see dom-host/)
dom-host = { path = "dom-host" }

[features]
# The production Skia binary: Ganesh + GL (rendering is CPU raster; this is what it always linked)
default = ["skia-ganesh-gl"]
skia-ganesh-gl = ["anyrender_skia/ganesh-gl"]
# Phase 4A experiment: an offscreen GPU (Skia Ganesh) backend next to the CPU renderer, chosen with
# the private `experimentalBackend` option. Off by default; the default build is CPU only.
experimental-gpu = ["skia-ganesh-gl", "anyrender_skia/headless-gpu"]
# Also Vulkan (switches the prebuilt Skia binary to ganesh-gl-vulkan)
experimental-gpu-vulkan = ["experimental-gpu", "anyrender_skia/vulkan"]
# Graphite on Vulkan (the prebuilt Skia binary graphite-vulkan has no Ganesh/GL), so it is built
# with --no-default-features --features experimental-graphite. CPU raster stays available.
experimental-graphite = ["anyrender_skia/headless-graphite"]

[build-dependencies]
napi-build = "2"

[profile.release]
lto = "thin"
codegen-units = 4

# Local fixes (typography): Blitz checkout on branch `typography-fixes` and vendored anyrender crates.
[patch."https://github.com/DioxusLabs/blitz"]
blitz-dom = { path = "third_party/blitz/packages/blitz-dom" }
blitz-html = { path = "third_party/blitz/packages/blitz-html" }
blitz-paint = { path = "third_party/blitz/packages/blitz-paint" }
blitz-traits = { path = "third_party/blitz/packages/blitz-traits" }
blitz-vibey-script = { path = "third_party/blitz/packages/blitz-vibey-script" }

[patch.crates-io]
anyrender = { path = "vendor/anyrender" }
anyrender_skia = { path = "vendor/anyrender_skia" }
stylo = { path = "vendor/stylo" }
